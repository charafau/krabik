name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # the tool is macOS first, but it has to build everywhere
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # the UI example is a standalone project, outside the workspace
      - run: cargo fmt --manifest-path packages/krabik-ui-android/example/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path packages/krabik-ui-android/example/rust/Cargo.toml --all-targets -- -D warnings
      # the UI DSL is a generated project with its own workspace
      - run: cargo fmt --manifest-path packages/krabik-ui-dsl/rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path packages/krabik-ui-dsl/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/krabik-ui-dsl/rust/Cargo.toml
      # the DSL example is a standalone project, outside the workspace
      - run: cargo fmt --manifest-path packages/krabik-ui-dsl/example/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path packages/krabik-ui-dsl/example/rust/Cargo.toml --all-targets -- -D warnings
      # the todo examples are standalone projects too
      - run: cargo fmt --manifest-path packages/krabik-ui-dsl/example-todo/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path packages/krabik-ui-dsl/example-todo/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/krabik-ui-dsl/example-todo/rust/Cargo.toml
      - run: cargo fmt --manifest-path packages/krabik-ui-dsl/example-todo-minimal/rust/Cargo.toml --check
      - run: cargo clippy --manifest-path packages/krabik-ui-dsl/example-todo-minimal/rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path packages/krabik-ui-dsl/example-todo-minimal/rust/Cargo.toml

  msrv:
    name: msrv (1.99.1)
    runs-on: ubuntu-latest
    env:
      # overrides the toolchain file, which pins the stable channel
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@v4
      # the ref is the action's release, not the toolchain: passing the version
      # as a ref makes Dependabot "update" it to a Rust release that may not exist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      # only the tests, the lints of the older clippy differ from the current one
      - run: cargo test --workspace

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # the DSL crate and the example crate are separate workspaces, so point
      # the cache at both
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/krabik-ui-dsl/rust
            packages/krabik-ui-dsl/example/rust
            packages/krabik-ui-dsl/example-todo/rust
            packages/krabik-ui-dsl/example-todo-minimal/rust
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          # the platform is versioned 37.0, which is what compileSdk = 37 uses
          packages: platforms;android-37.0 build-tools;37.0.0 ndk;27.2.12479018
      - uses: gradle/actions/setup-gradle@v6
      # arm64 is the production ABI; building it also compiles the Kotlin and JNI code
      - name: Assemble debug APK
        working-directory: packages/krabik-ui-dsl/android
        run: ./gradlew :app:assembleDebug --no-daemon -PkrabikAbis=arm64-v8a
      # the example shell is a separate Gradle project; building it also proves
      # the example cdylib exports the JNI install entry point the app loads
      - name: Assemble the example debug APK
        working-directory: packages/krabik-ui-dsl/example/android
        run: ./gradlew :app:assembleDebug --no-daemon -PkrabikAbis=arm64-v8a
      - name: Assemble the todo example debug APK
        working-directory: packages/krabik-ui-dsl/example-todo/android
        run: ./gradlew :app:assembleDebug --no-daemon -PkrabikAbis=arm64-v8a
      - name: Assemble the minimal todo example debug APK
        working-directory: packages/krabik-ui-dsl/example-todo-minimal/android
        run: ./gradlew :app:assembleDebug --no-daemon -PkrabikAbis=arm64-v8a

  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/krabik-ui-dsl/rust
            packages/krabik-ui-dsl/example/rust
            packages/krabik-ui-dsl/example-todo/rust
            packages/krabik-ui-dsl/example-todo-minimal/rust
      # lints the iOS renderer, which the `check` job never compiles because
      # it runs on Linux and macOS hosts, not the iOS target
      - run: cargo clippy --manifest-path packages/krabik-ui-dsl/rust/Cargo.toml --target aarch64-apple-ios-sim --features ios -- -D warnings
      - name: Build the static library
        working-directory: packages/krabik-ui-dsl/rust
        run: cargo build --target aarch64-apple-ios-sim --features ios
      - name: Build the example static library
        working-directory: packages/krabik-ui-dsl/example/rust
        run: cargo build --target aarch64-apple-ios-sim
      - name: Build the todo example static library
        working-directory: packages/krabik-ui-dsl/example-todo/rust
        run: cargo build --target aarch64-apple-ios-sim
      - name: Build the minimal todo example static library
        working-directory: packages/krabik-ui-dsl/example-todo-minimal/rust
        run: cargo build --target aarch64-apple-ios-sim
