[workspace]
resolver = "3"
members = ["packages/krabik-cli", "packages/krabik-ui-android"]
default-members = ["packages/krabik-cli"]
exclude = ["packages/krabik-ui-android/example"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/charafau/krabik"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
jni = "0.22"
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.15.0"

[workspace.lints.clippy]
all = "warn"
