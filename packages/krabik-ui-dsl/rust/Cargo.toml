[package]
name = "krabik-ui-dsl"
version = "0.1.0"
edition = "2024"

[lib]
# The rlib lets consumer crates (see `example/`) link the DSL; the cdylib is
# the Android JNI library and the staticlib is linked into the iOS app.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
jni = "0.22"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSCalendar", "NSData", "NSDate", "NSError", "NSGeometry", "NSIndexPath", "NSObject", "NSString", "NSURL", "NSURLResponse", "NSURLSession"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAGradientLayer", "CADisplayLink", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-ui-kit = { version = "0.3", features = [
    "block2",
    "NSParagraphStyle",
    "NSText",
    "UIAction",
    "UIAccessibility",
    "UIButton",
    "UIColor",
    "UICollectionView",
    "UICollectionViewCell",
    "UICollectionViewFlowLayout",
    "UICollectionViewLayout",
    "UIControl",
    "UIDatePicker",
    "UIFont",
    "UIGeometry",
    "UIImage",
    "UIImageView",
    "UILabel",
    "UIMenuElement",
    "NSIndexPath_UIKitAdditions",
    "UIResponder",
    "UIProgressView",
    "UIScrollView",
    "UISlider",
    "UISwitch",
    "UITextField",
    "UIBarItem",
    "UITextInputTraits",
    "UITimingCurveProvider",
    "UITimingParameters",
    "UIView",
    "UIViewAnimating",
    "UIViewPropertyAnimator",
    "UIWindow",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }

# Not part of the repository's root workspace.
[workspace]
