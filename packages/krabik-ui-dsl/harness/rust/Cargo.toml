[package]
name = "krabik-ui-dsl-harness"
version = "0.1.0"
edition = "2024"

[lib]
# The staticlib is linked into the iOS app; the cdylib is loaded by the
# Android app and exports the framework's JNI entry points plus the install call.
crate-type = ["staticlib", "cdylib"]

[dependencies]
krabik-ui-dsl = { path = "../../rust" }
jni = "0.22"

# This crate is a standalone project. The empty workspace table keeps cargo
# from adopting a parent workspace.
[workspace]
