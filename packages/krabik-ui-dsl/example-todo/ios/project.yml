# The Xcode project is generated from this file: run `xcodegen generate` here
# after changing it. The generated project is committed so the app builds
# without XcodeGen.
name: KrabikUiDslTodo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# `Local.xcconfig` is optional and not committed: put DEVELOPMENT_TEAM = <your
# team id> there to run on a device. The simulator needs no signing identity.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    # The Rust build phase runs cargo, which reads and writes outside the
    # script's declared inputs.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  KrabikUiDslTodo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The Swift host shared by every app.
      - path: ../../shared/ios
    preBuildScripts:
      # Builds ../rust so the app never links a stale library.
      - name: Build Rust library
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../../shared/build-rust-ios.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.krabik-ui-dsl-todo
        PRODUCT_NAME: KrabikUiDslTodo
        RUST_LIB: krabik_ui_dsl_todo
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../rust/target/xcode/$(PLATFORM_NAME)-$(CONFIGURATION)
        OTHER_LDFLAGS:
          - -l$(RUST_LIB)
    scheme:
      testTargets:
        - KrabikUiDslTodoUITests

  KrabikUiDslTodoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: KrabikUiDslTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.krabik-ui-dsl-todo-uitests
        TEST_TARGET_NAME: KrabikUiDslTodo
