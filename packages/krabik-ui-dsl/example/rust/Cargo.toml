[package]
name = "krabik-ui-dsl-example"
version = "0.1.0"
edition = "2024"

[lib]
# The staticlib is linked into the iOS app; the cdylib is loaded by the
# Android app and exports the DSL's JNI entry points plus the install call.
crate-type = ["staticlib", "cdylib"]

[dependencies]
# `svg` adds the renderer for `.svg` assets, which the Image and Stack pages show.
krabik-ui-dsl = { path = "../../rust", features = ["svg"] }
jni = "0.22"

# This crate is a standalone project, mirroring the `rust/` directory that `krabik create`
# generates. The empty workspace table keeps cargo from adopting a parent workspace.
[workspace]
