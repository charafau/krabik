name: KrabikUiDslTodoMinimal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    RUST_TARGET: aarch64-apple-ios-sim
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

targets:
  KrabikUiDslTodoMinimal:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.krabik-ui-dsl-todo-minimal
        PRODUCT_NAME: KrabikUiDslTodoMinimal
        SWIFT_OBJC_BRIDGING_HEADER: Sources/KrabikIOS.h
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../rust/target/$(RUST_TARGET)/$(CONFIGURATION:lower)
        OTHER_LDFLAGS:
          - -lkrabik_ui_dsl_todo_minimal
    scheme:
      testTargets:
        - KrabikUiDslTodoMinimalUITests

  KrabikUiDslTodoMinimalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: KrabikUiDslTodoMinimal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.krabik-ui-dsl-todo-minimal-uitests
        TEST_TARGET_NAME: KrabikUiDslTodoMinimal
