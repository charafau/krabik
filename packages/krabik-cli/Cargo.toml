[package]
name = "krabik-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scaffold and build cross-platform Rust mobile apps (Android/iOS) with UniFFI"
readme = "README.md"
keywords = ["android", "ios", "uniffi", "scaffolding", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "krabik"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
anyhow.workspace = true
clap.workspace = true
notify.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
