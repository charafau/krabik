[package]
name = "krabik"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Scaffold and build cross-platform Rust mobile apps (Android/iOS) with UniFFI"
readme = "README.md"
keywords = ["android", "ios", "uniffi", "scaffolding", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.15.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
